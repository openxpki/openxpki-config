main:
    debug: 0
    type: MariaDB2
    name: openxpki
    #host: localhost
    #port: 3306

    user: openxpki
    passwd: openxpki

    tls:
        # Enable TLS connection (supported for MariaDB + PostgreSQL)
        #enabled: 1
        # Verify the "host" (see above) against the DB server certificate
        #verify_hostname: 1
        # Single file with one or more PEM encoded certificates
        #ca_file: /path/to/pem
        # Directory with PEM encoded certificates (alternative to ca_file)
        #ca_dir: /path/to/pemdir

    # Customized options to pass to DBI->connect()
    dbi:
        # Additional parameters for the DSN (will be prepended by a semicolon)
        #dsn_extra: dummyvalue=1

        # Additional attributes to pass to DBI->connect (fourth parameter)
        attrs:
            #LongReadLen: 10000000

    # How often to try to connect to the database on startup if not avail -
    # default is to fail immediately. This is mainly useful if database and
    # OpenXPKI are started by the same init process and the DB might take
    # some time to come up
    #wait_on_init:
    #    retry_count: 10
    #    retry_interval: 30


# To log to a different database create a section "log" by copying and adjusting
# the upper block, e.g.:
#
# log:
#     debug: 0
#     ...

# Set environment values, e.g. locales for Oracle
# this was inside the db section prior v2.2 which does not work as expected
# environment:
#    key: value
