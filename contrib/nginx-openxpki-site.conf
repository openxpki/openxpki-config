# The nginx worker must be able to access the socket of openxpki-clientd,
# see socket_group in client.d/system/server.yaml

# Some people think it is a risk to expose information about the server.
# This setting reduces the information disclosure to the bare minimum.
# You should also remove any unused modules from the server!
server_tokens off;

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

# The backend reads webserver environment variables from the
# X-ReverseProxy-ENV-* / X-ReverseProxy-ENVPLAIN-* request headers. The
# variable names (SSL_CLIENT_*, sso_openxpki_*) contain underscores, so
# nginx silently drops such headers when sent by the HTTP client as long
# as both settings below keep their defaults. Do NOT enable
# underscores_in_headers or disable ignore_invalid_headers, otherwise a
# client can inject those variables.
# Both settings must be in http context (or the default server) to apply.
underscores_in_headers off;
ignore_invalid_headers on;

# HTTP server block
server {
    listen 80;
    server_name _;

    root /var/www/openxpki;

    location / {
        # Deny methods other than GET, HEAD, POST
        limit_except GET HEAD POST { deny all; }
        # Or, to specifically deny TRACE (though Nginx already does this)
        # if ($request_method = TRACE) { return 405; }

    	# Default: redirect traffic to HTTPS
        return 301 https://$http_host$request_uri;
    }

    #
    # Proxy configurations
    #

    # Do not overwrite backend's "Server" response header with "nginx..."
    proxy_pass_header Server;

    # Forward metadata
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-ReverseProxy-ENVSET 1;
    proxy_set_header X-Forwarded-Host $http_host;

    # Prevent injection of client certificate data, see the note on
    # underscores_in_headers above. An empty value removes the header.
    proxy_set_header X-ReverseProxy-ENV-SSL_CLIENT_S_DN "";
    proxy_set_header X-ReverseProxy-ENV-SSL_CLIENT_CERT "";
    proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_S_DN "";
    proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_CERT "";

    location /download/ {
        alias /var/www/download/;
        autoindex off;
    }

    location /healthcheck {
        proxy_pass http://unix:/run/openxpki-clientd/openxpki-clientd.sock;
    }

    location /scep {
        proxy_pass http://unix:/run/openxpki-clientd/openxpki-clientd.sock;
        charset off;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    server_name _;

    root /var/www/openxpki;

    # Only enable more modern TLS versions
    ssl_protocols TLSv1.2 TLSv1.3;

    # Enforce cipher suite settings that are considered to be good.
    # Leaves DHE based key exchanges with AES and SHA256+ encryption (+POLY1305/CHACHA).
    # You might need to relax this if you need to talk with older clients or resource limited IoT devices - YMMV.
    # A good entry point if you are not familiar with this is https://ssl-config.mozilla.org/
    ssl_ciphers HIGH:!NULL:+AES:!CAMELLIA:!SEED:!ARIA:!IDEA:!DES:!3DES:!RC2:!RC4:!PSK:!SHA:!MD5:!RSA:!AESCCM:!DSS:!ADH;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
    ssl_certificate /etc/openxpki/tls/endentity/openxpki.crt;
    ssl_certificate_key /etc/openxpki/tls/private/openxpki.pem;

    # required when mTLS terminination is done by this server
    # use ssl_trusted_certificate to hide the chain from the client
    # Note: the server will not start unless this file exists
    ssl_client_certificate /etc/openxpki/tls/chain/bundle.pem;
    ssl_verify_client optional;
    ssl_verify_depth 3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        # Deny methods other than GET, HEAD, POST
        limit_except GET HEAD POST { deny all; }
    }

    # Append slash to WebUI URL paths except for file paths that contain a dot
    location ~ ^(/webui/[^.]*[^/])$ {
        return 301 https://$http_host$1/;
    }

    # Default: redirect to WebUI entry point
    location = / {
        return 301 https://$http_host/webui/index/;
    }

    #
    # Proxy configurations
    #

    # Do not overwrite backend's "Server" response header with "nginx..."
    proxy_pass_header Server;

    # Forward metadata
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-ReverseProxy-ENVSET 1;
    proxy_set_header X-Forwarded-Host $http_host;

    # Prevent injection of the base64 variants of the client certificate
    # data, see the note on underscores_in_headers above. The ENVPLAIN
    # variants are replaced below. An empty value removes the header.
    proxy_set_header X-ReverseProxy-ENV-SSL_CLIENT_S_DN "";
    proxy_set_header X-ReverseProxy-ENV-SSL_CLIENT_CERT "";

    # Forward client certificates in direct mode
    proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_S_DN $ssl_client_s_dn;
    proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_CERT $ssl_client_escaped_cert;

    # Forward client certificates in gateway mode
    # proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_S_DN $http_x_forwarded_ssl_client_s_dn;
    # proxy_set_header X-ReverseProxy-ENVPLAIN-SSL_CLIENT_CERT $http_x_forwarded_ssl_client_cert;

    # Forward external authentication headers
    # proxy_set_header X-ReverseProxy-ENVPLAIN-sso_openxpki_user $http_x_sso_openxpki_user;
    # proxy_set_header X-ReverseProxy-ENVPLAIN-sso_openxpki_name $http_x_sso_openxpki_name;
    # proxy_set_header X-ReverseProxy-ENVPLAIN-sso_openxpki_email $http_x_sso_openxpki_email;
    # proxy_set_header X-ReverseProxy-ENVPLAIN-sso_openxpki_role $http_x_sso_openxpki_role;

    # cmc and acme are EE only
    location ~ ^/(rpc|cmc|acme|healthcheck|webui/[a-z0-9-]+/cgi-bin/webui.fcgi) {
        # remove "cgi-bin/webui.fcgi"
        rewrite (webui/([a-z0-9-]+)/)cgi-bin/webui.fcgi $1 break;

        proxy_pass http://unix:/run/openxpki-clientd/openxpki-clientd.sock;
    }

    location /.well-known/est {
        proxy_pass http://unix:/run/openxpki-clientd/openxpki-clientd.sock;
    }

    #
    # Static WebUI assets
    #
    location ~ ^/webui/[a-z0-9-]+/(.*) {
        try_files /$1 /index.html =404;
    }

    # Access to download folder
    location /download/ {
        alias /var/www/download/;
    }
}
